<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>Édition live (essai)</title><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Essai ISOLÉ de l'édition collaborative en direct : du texte simple, TipTap 3 + Yjs, la table liée au widget comme canal.
     Il n'utilise aucun fichier du widget Publipostage+ ni de sa page (index.html). Lisez README.md avant de le brancher dans Grist.
     La politique ci-dessous est celle du widget (script-src), avec l'empreinte de la carte d'importation de CETTE page : si vous
     modifiez la carte, recalculez l'empreinte (test-edition-live.mjs la vérifie). -->
<meta http-equiv="Content-Security-Policy" content="
  script-src 'self' 'unsafe-eval' https://esm.sh https://docs.getgrist.com/grist-plugin-api.js 'sha256-2EGMNnd636lnGkXCtFiarEWmNy91/EjscyCOIH2Gjog=';
  object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<!-- Même carte que le widget pour ProseMirror (UNE seule instance de chaque paquet), plus Yjs, y-protocols, lib0 et les deux
     extensions de collaboration de TipTap 3, construites par esm.sh avec « * » : leurs dépendances passent par cette carte. -->

<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="bar">
  <button id="live-toggle" type="button" class="toggle" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="live-label"></span></button>
  <label class="field"><span id="name-label"></span><input id="name" type="text" maxlength="24" autocomplete="off"></label>
  <span id="peers" class="peers" aria-live="polite"></span>
  <span class="spacer"></span>
  <label class="field"><span id="flush-label"></span>
    <select id="flush"><option value="50">50 ms</option><option value="150">150 ms</option><option value="300">300 ms</option><option value="600">600 ms</option><option value="1000">1000 ms</option></select></label>
  <button id="compact" type="button"></button>
</header>
<p class="line"><span id="status" role="status"></span> · <span id="source"></span></p>
<section id="setup" class="setup" hidden>
  <strong id="setup-title"></strong>
  <p id="setup-text"></p>
  <button id="setup-btn" type="button"></button>
</section>
<main id="editor" class="editor"></main>
<p id="stats" class="line stats"></p>
<details class="journal"><summary id="log-title"></summary><pre id="log"></pre></details>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
