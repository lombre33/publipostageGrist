<!-- La page des nouveautés (consigne 070 de GFS) : la fenêtre que la version 1 ouvre dans le widget (js/whats-new.js), seule sur sa page. Le bouton « Découvrir les nouveautés » du bandeau de la bêta figée l'ouvre dans un
     nouvel onglet (outils/depot-propre/beta/), dans la langue de son widget : nouveautes.html?lang=fr ou ?lang=en (js/i18n.js). Elle n'est pas le widget : ni Grist, ni GFS, ni éditeur, ni mémoire de la personne
     (js/news-page.js lit son thème et ne retient rien). Les scripts, les feuilles de style et leurs versions (`?v=`) sont ceux d'index.html : le navigateur les a déjà s'il a ouvert le widget, et
     `node outils/precharger-scripts.mjs` les aligne sur index.html et réécrit le bloc de préchargement (dev-tests/verify-code-hygiene.mjs le vérifie). Politique de sécurité du contenu : rien que ses propres fichiers, aucun
     script en ligne, aucune connexion, aucun cadre. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
