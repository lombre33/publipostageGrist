<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>Diaporama · Slide show</title><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/jpeg" href="../../img/grist-factory-logo.jpg">
<!-- La fenêtre à part du diaporama (extensions/diapositives/slide-window.js dit pourquoi, slide-present.js ce qu'elle fait). Elle reçoit le rendu de la présentation de l'app qui l'a ouverte : même politique de
     sécurité du contenu que index.html moins ce qu'elle n'utilise pas (ni bibliothèque, ni 'unsafe-eval', aucun script en ligne), si bien que même du HTML piégé reçu en message ne s'exécute pas. Les
     numéros de version (?v=) sont ceux d'index.html pour css/ et js/, et celui de l'extension (js/extensions.js) pour le reste : codeHygiene garde qu'ils s'accordent. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<link rel="stylesheet" href="../../css/style.css?v=0.102">
<link rel="stylesheet" href="slide-show.css?v=0.40">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* Tant que rien n'est arrivé de l'app (page ouverte seule, ou app fermée) : un mot, qui ne paraît qu'après trois secondes pour ne pas clignoter à l'ouverture normale. */
  #pp-present-wait { position: fixed; opacity: 0; animation: pp-present-wait-in .01s 3s forwards; }
  @keyframes pp-present-wait-in { to { opacity: 1; } }
</style>
</head>
<body>
<main id="pp-present-wait" class="pp-slide-show-card">Ce diaporama s’ouvre depuis Publipostage+ : bouton ▶ de la bande des diapositives. · This slide show opens from Publipostage+: the ▶ button of the slide strip.</main>
<script src="../../js/dom.js?v=0.3"></script>
<script src="../../js/slide-props.js?v=0.9"></script>
<script src="../../js/frame-anim.js?v=0.1"></script>
<script src="slide-transitions.js?v=0.40"></script>
<script src="slide-player.js?v=0.40"></script>
<script src="slide-window.js?v=0.40"></script>
<script src="slide-present.js?v=0.40"></script>
</body>
</html>
