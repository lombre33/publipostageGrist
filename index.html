<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Publipostage Grist</title>
    
    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <!-- Grist API -->
    <script src="https://docs.getgrist.com/grist-api.ts" type="module"></script>
    
    <!-- Notre code (avec defer pour attendre le DOM) -->
    <script src="js/grist-api.js" defer></script>
    <script src="js/variables.js" defer></script>
    <script src="js/editor.js" defer></script>
    <script src="js/reader-mode.js" defer></script>
    <script src="js/main.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 16px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f9f9f9;
        }
        
        .header h1 {
            margin: 0 0 16px 0;
            font-size: 24px;
            color: #333;
        }
        
        .status {
            font-size: 14px;
            color: #666;
            padding: 8px 12px;
            background: #e8f4f8;
            border-radius: 4px;
            display: inline-block;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        button.secondary:hover {
            background: #545b62;
        }
        
        button.danger {
            background: #dc3545;
        }
        
        button.danger:hover {
            background: #c82333;
        }
        
        .content {
            padding: 20px;
        }
        
        #editor-container {
            margin-bottom: 20px;
        }
        
        #reader-mode {
            display: none;
        }
        
        .ql-container {
            font-size: 16px;
            font-family: inherit;
        }
        
        .ql-editor {
            min-height: 400px;
            max-height: 600px;
        }
        
        input[type="text"], input[type="file"], select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #333;
        }
        
        .template-section {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        
        .error-banner {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }
        
        .error-banner.show {
            display: block;
        }
        
        .error-banner.close-btn {
            float: right;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Widget Publipostage</h1>
            <div class="status" id="status">Widget prêt.</div>
        </div>
        
        <div class="content">
            <!-- Error Banner -->
            <div class="error-banner" id="error-banner">
                <span class="close-btn" onclick="document.getElementById('error-banner').classList.remove('show');">&times;</span>
                <span id="error-message"></span>
            </div>
            
            <!-- Mode Toggle -->
            <div class="controls">
                <button id="mode-toggle-btn" class="secondary">Mode Lecture</button>
                <button id="export-pdf-btn">📥 Exporter PDF</button>
            </div>
            
            <!-- Template Section -->
            <div class="template-section" id="template-section">
                <div class="form-group">
                    <label for="template-select">Modèle :</label>
                    <select id="template-select">
                        <option value="">-- Sélectionner un modèle --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="template-name-input">Nom du modèle :</label>
                    <input type="text" id="template-name-input" placeholder="Nom du modèle">
                </div>
                
                <div class="form-group">
                    <label for="pdf-filename-input">Nom du fichier PDF :</label>
                    <input type="text" id="pdf-filename-input" placeholder="nom_du_fichier" value="document">
                </div>
                
                <div class="controls">
                    <button id="save-template-btn">💾 Enregistrer</button>
                    <button id="delete-template-btn" class="danger">🗑️ Supprimer</button>
                </div>
            </div>
            
            <!-- Editor Container -->
            <div id="editor-container"></div>
            
            <!-- Reader Mode -->
            <div id="reader-mode"></div>
        </div>
    </div>
</body>
</html>
