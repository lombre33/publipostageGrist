<!-- Import map copiée de index.html (mêmes versions épinglées, même raison : une seule
     instance de chaque paquet prosemirror-* dans le bundle), augmentée de
     @handlewithcare/prosemirror-suggest-changes@0.1.8 et de ses 3 dépendances ProseMirror
     (state/transform/view, pas de prosemirror-model - vérifié dans son code source réel),
     elles-mêmes réécrites vers les instances déjà épinglées ci-dessous, sur le même patron que
     les sous-chemins @tiptap/pm/* déjà présents. -->
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.11",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.4",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.12.0",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.42.3",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.5.0",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.3",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.7.1",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.8.5",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.4.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.2",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.5.1",
    "prosemirror-changeset": "https://esm.sh/*prosemirror-changeset@2.4.1",
    "@tiptap/core": "https://esm.sh/@tiptap/core@3.31.3",
    "@tiptap/pm": "https://esm.sh/@tiptap/pm@3.31.3",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/model.mjs": "https://esm.sh/*prosemirror-model@1.25.11",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/state.mjs": "https://esm.sh/*prosemirror-state@1.4.4",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/view.mjs": "https://esm.sh/*prosemirror-view@1.42.3",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/transform.mjs": "https://esm.sh/*prosemirror-transform@1.12.0",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/keymap.mjs": "https://esm.sh/*prosemirror-keymap@1.2.3",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/commands.mjs": "https://esm.sh/*prosemirror-commands@1.7.1",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/schema-list.mjs": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/tables.mjs": "https://esm.sh/*prosemirror-tables@1.8.5",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/gapcursor.mjs": "https://esm.sh/*prosemirror-gapcursor@1.4.1",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/dropcursor.mjs": "https://esm.sh/*prosemirror-dropcursor@1.8.2",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/inputrules.mjs": "https://esm.sh/*prosemirror-inputrules@1.5.1",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/history.mjs": "https://esm.sh/*prosemirror-history@1.5.0",
    "https://esm.sh/@tiptap/pm@3.31.3/es2022/changeset.mjs": "https://esm.sh/*prosemirror-changeset@2.4.1",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@3.31.3",
    "@tiptap/extension-document": "https://esm.sh/@tiptap/extension-document@3.31.3",
    "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@3.31.3",
    "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@3.31.3",
    "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@3.31.3",
    "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@3.31.3",
    "@handlewithcare/prosemirror-suggest-changes": "https://esm.sh/@handlewithcare/prosemirror-suggest-changes@0.1.8",
    "https://esm.sh/prosemirror-state@^1.0.0?target=es2022": "https://esm.sh/*prosemirror-state@1.4.4",
    "https://esm.sh/prosemirror-transform@^1.0.0?target=es2022": "https://esm.sh/*prosemirror-transform@1.12.0",
    "https://esm.sh/prosemirror-view@^1.0.0?target=es2022": "https://esm.sh/*prosemirror-view@1.42.3"
  }
}
</script>
<style>

  .banner { background: #f5f5f5; border: 1px solid #ddd; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; max-width: 700px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; max-width: 700px; }

<body>
<div class="banner">
  Prototype jetable — pas lié à <code>index.html</code>, pas de Grist. Teste la faisabilité du
  suivi des modifications (mode suggestion) avec <code>prosemirror-suggest-changes</code> sur le
  même import map TipTap/ProseMirror que l'éditeur réel. Voir
  <code>planning/feature-track-changes.md</code>.
</div>
<div class="toolbar">
  <button id="btn-bold" title="Gras"><b>G</b></button>
  <button id="btn-italic" title="Italique"><i>I</i></button>
  <button id="btn-toggle">Suivi : désactivé</button>
  <button id="btn-accept-all">Tout accepter</button>
  <button id="btn-reject-all">Tout refuser</button>
  <button id="btn-accept-sel">Accepter la sélection</button>
  <button id="btn-reject-sel">Refuser la sélection</button>
  <button id="btn-undo">Annuler</button>
  <button id="btn-redo">Rétablir</button>
  <button id="btn-del-row">Supprimer la ligne « Widget A »</button>
</div>
<div id="editor"></div>
<div id="log"></div>
<script type="module">
  // Tiptap 3.x n'exporte rien en `default` (constaté en testant ce prototype) - imports nommés,
  // même patron que js/editor.js.
  import { Editor, Mark, Extension } from '@tiptap/core'
  import { StarterKit } from '@tiptap/starter-kit'
  import { Document } from '@tiptap/extension-document'
  import { Table } from '@tiptap/extension-table'
  import { TableRow } from '@tiptap/extension-table-row'
  import { TableCell } from '@tiptap/extension-table-cell'
  import { TableHeader } from '@tiptap/extension-table-header'
  import {
    suggestChanges, suggestChangesKey, toggleSuggestChanges, isSuggestChangesEnabled,
    applySuggestions, revertSuggestions, applySuggestion, revertSuggestion,
    transformToSuggestionTransaction,
  } from '@handlewithcare/prosemirror-suggest-changes'

  const logEl = document.getElementById('log')
  const log = (msg) => { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log('[proto]', msg) }
  window.addEventListener('error', (e) => log('ERREUR JS: ' + e.message))
  window.addEventListener('unhandledrejection', (e) => log('ERREUR (promise): ' + e.reason))

  // Marques Tiptap reproduisant exactement les MarkSpecs de prosemirror-suggest-changes@0.1.8
  // (code source lu directement sur esm.sh) : la lib retrouve ces marques par NOM dans le schema
  // (schema.marks.insertion/.deletion/.modification), d'où les noms figés ci-dessous. `excludes`
  // ne liste QUE les 3 marques de la lib entre elles : aucun conflit avec les marques custom de
  // l'app réelle (gras, commentMark, etc.), qui ne sont pas dans cette liste.
  const InsertionMark = Mark.create({
    name: 'insertion',
    inclusive: false,
    excludes: 'deletion modification insertion',
    addAttributes() { return { id: { default: null } } },
    parseHTML() { return [{ tag: 'ins', getAttrs: el => (el.dataset.id ? { id: JSON.parse(el.dataset.id) } : false) }] },
    renderHTML({ HTMLAttributes }) { return ['ins', { 'data-id': JSON.stringify(HTMLAttributes.id) }, 0] },
  })
  const DeletionMark = Mark.create({
    name: 'deletion',
    inclusive: false,
    excludes: 'insertion modification deletion',
    addAttributes() { return { id: { default: null } } },
    parseHTML() { return [{ tag: 'del', getAttrs: el => (el.dataset.id ? { id: JSON.parse(el.dataset.id) } : false) }] },
    renderHTML({ HTMLAttributes }) { return ['del', { 'data-id': JSON.stringify(HTMLAttributes.id) }, 0] },
  })
  const ModificationMark = Mark.create({
    name: 'modification',
    inclusive: false,
    excludes: 'deletion insertion',
    addAttributes() {
      return {
        id: { default: null }, type: { default: null },
        attrName: { default: null }, previousValue: { default: null }, newValue: { default: null },
      }
    },
    parseHTML() { return [{ tag: "span[data-type='modification']" }] },
    renderHTML({ HTMLAttributes }) { return ['span', { 'data-type': 'modification', 'data-id': JSON.stringify(HTMLAttributes.id) }, 0] },
  })

  // CORRECTIF (2026-09-19) — vraie prise en charge de la suppression de bloc entier, remplaçant le
  // simple refus posé le 2026-09-18. Diagnostic en lisant le code source réel de la lib
  // (dist/replaceStep.js) : quand une suppression correspond EXACTEMENT à un ou plusieurs nœuds de
  // bloc entiers (`blockRange.start === stepFrom && blockRange.end === stepTo`), la lib appelle
  // `tr.addNodeMark(pos, deletion.create(...))` - une marque posée sur le NŒUD lui-même (pas sur son
  // contenu inline). Ça ne plantait pas dans la lib elle-même : ça plantait dans ProseMirror, qui
  // valide que le PARENT du nœud marqué autorise cette marque sur ses enfants
  // (`NodeType.allowsMarks`, calculé depuis `NodeSpec.marks` du parent - constaté en lisant
  // prosemirror-model : "nodes with inline content default to allowing all marks, other nodes
  // default to not allowing marks"). `doc` (parent d'un paragraphe) et `table` (parent d'une ligne)
  // ne déclarent pas `marks` dans Tiptap 3.x (vérifié dans le code source réel de
  // @tiptap/extension-document et @tiptap/extension-table) : suppression de bloc entier impossible
  // à marquer avec le schéma par défaut, d'où "Invalid content for node doc/table". Correctif :
  // étendre ces deux nœuds pour autoriser explicitement les 3 marques de suivi sur leurs enfants.
  const TrackedDocument = Document.extend({ marks: 'insertion deletion modification' })
  const TrackedTable = Table.extend({ marks: 'insertion deletion modification' })

  // Second bug trouvé en testant (2026-09-19), cette fois DANS la lib elle-même (pas dans notre
  // schéma) : `applySuggestions`/`revertSuggestions`/`applySuggestion`/`revertSuggestion`
  // (commands.js) plantent avec "Cannot read properties of undefined (reading 'nodeSize')" quand le
  // bloc traité est le tout DERNIER nœud du document entier. En cause : leur calcul de "y a-t-il un
  // espace juste après, pour fusionner proprement" fait
  // `deletionTo <= tr.doc.content.size ? tr.doc.textBetween(deletionTo, deletionTo + 1, ...) : ""`
  // - `<=` au lieu de `<` : quand `deletionTo === content.size` (fin réelle du document), ça essaie
  // quand même de lire un caractère à `content.size + 1`, hors limites. Pas quelque chose qu'on peut
  // corriger depuis notre code (bug dans le paquet chargé depuis esm.sh).
  //
  // Premier contournement essayé (2026-09-19, abandonné après revue) : un plugin ProseMirror
  // permanent (`appendTransaction`) qui aurait maintenu un paragraphe vide en fin de document en
  // permanence. Deux défauts trouvés en le faisant relire : (1) comme il réagit à CHAQUE transaction
  // qui change le document, y compris les transactions d'annulation elles-mêmes, il pouvait
  // ré-insérer un paragraphe juste après qu'Annuler venait de le retirer, empêchant l'historique de
  // revenir à l'état d'origine (constaté : plusieurs Ctrl+Z de suite sans jamais retrouver le HTML de
  // départ) ; (2) il ne s'appliquait qu'après une PREMIÈRE transaction depuis le chargement, donc un
  // document chargé depuis Grist avec une marque déjà posée sur son tout dernier nœud (exactement le
  // cas réel : un suivi commencé dans une session, repris dans une autre) plantait quand même dès le
  // premier accepter/refuser.
  //
  // Contournement retenu : pas de structure permanente. On ne touche au document qu'au moment précis
  // d'appeler une des 4 fonctions à risque, et seulement quand c'est nécessaire (le dernier nœud du
  // document porte réellement une marque de suivi) : un paragraphe vide temporaire est inséré juste
  // après lui, l'opération s'exécute, puis le paragraphe est retiré s'il est resté vide et sans
  // marque. Les deux transactions de bord (ajout/retrait) sont exclues de l'historique
  // (`addToHistory: false`) : invisibles pour Annuler/Rétablir, donc aucun conflit possible avec eux,
  // et le correctif s'applique dès le tout premier appel, y compris sur un document qui vient d'être
  // chargé.
  function lastNodeCarriesSuggestionMark(state) {
    const last = state.doc.lastChild
    return !!last && last.marks.some((m) => ['insertion', 'deletion', 'modification'].includes(m.type.name))
  }
  // BUG TROUVÉ EN FAISANT RELIRE CE CORRECTIF (2026-09-19) : la toute première version passait le
  // `dispatch` fourni par Tiptap au contexte de commande à `applySuggestions`/`revertSuggestion` et à
  // nos transactions de bourrage. Ça ne faisait RIEN, silencieusement. Cause, vue dans le code source
  // réel de @tiptap/core (`CommandManager.buildProps`) : pour un appel direct `editor.commands.xxx()`
  // (pas une chaîne), Tiptap fournit `dispatch: () => void 0` (un NO-OP) et un `state` "chaînable" où
  // `state.tr` est TOUJOURS LE MÊME objet Transaction partagé pendant tout l'appel ; Tiptap dispatche
  // ce tr partagé lui-même, une fois, après le retour de la commande. Passer `editor.state` (l'état
  // RÉEL déjà validé, figé) au lieu de ce `state` chaînable crée un tr ORPHELIN à chaque fois
  // (`editor.state.tr` est un nouvel objet à chaque lecture) que le `dispatch` no-op jette
  // silencieusement - la mutation n'atteint jamais la vue. Ça ne se voyait pas sur les commandes
  // simples (une seule mutation, laissée au tr partagé de Tiptap) mais cassait justement ce
  // correctif, qui a besoin d'appliquer réellement plusieurs transactions dans l'ordre (bourrage,
  // opération, nettoyage) pour que chacune voie le résultat de la précédente. Corrigé en utilisant
  // directement `editor.view.dispatch` (le vrai dispatch ProseMirror, synchrone, jamais un no-op) et
  // en empêchant Tiptap de dispatcher en plus son propre tr partagé resté vide (`preventDispatch`).
  function runGuardedLibCommand(libFn, editor, dispatch, tr) {
    if (!dispatch) return libFn(editor.state, undefined) // vérif de capacité (editor.can()...) : pas de mutation
    if (tr) tr.setMeta('preventDispatch', true)
    if (!lastNodeCarriesSuggestionMark(editor.state)) return libFn(editor.state, editor.view.dispatch)
    // `editor.view.dispatch` retraverse `SuggestChangesBridge.dispatchTransaction` (c'est le VRAI
    // dispatch de la vue, celui-là même que ce hook intercepte). Sans le meta `{skip: true}` sur
    // `suggestChangesKey` - la même convention que `applySuggestions`/`revertSuggestions` utilisent
    // pour LEUR propre transaction (voir plus haut) -, nos transactions de bourrage/nettoyage
    // seraient elles-mêmes transformées en nouvelles suggestions (un paragraphe vide qui apparaîtrait
    // comme "en attente d'insertion") au lieu de rester des changements de structure invisibles.
    const guardMeta = (t) => t.setMeta(suggestChangesKey, { skip: true }).setMeta('addToHistory', false)
    editor.view.dispatch(guardMeta(editor.state.tr
      .insert(editor.state.doc.content.size, editor.state.schema.nodes.paragraph.create())))
    const result = libFn(editor.state, editor.view.dispatch)
    // Retire le paragraphe-tampon s'il est resté vide et sans marque. Remarque trouvée en testant :
    // StarterKit embarque par défaut sa PROPRE extension `TrailingNode` (@tiptap/extensions,
    // vérifié dans le code source réel de @tiptap/starter-kit) qui garantit indépendamment que le
    // document ne se termine jamais par autre chose qu'un paragraphe (par ex. juste après un
    // tableau) - un mécanisme existant, sans rapport avec ce correctif. Si retirer notre tampon
    // expose un nœud non-paragraphe en toute fin de document (ex. un tableau), TrailingNode en
    // réinsère un lui-même dans la MÊME transaction : notre retrait semble alors n'avoir aucun
    // effet, ce qui est correct - c'est le comportement normal et permanent de l'éditeur, pas un
    // reliquat propre à ce correctif.
    const guard = editor.state.doc.lastChild
    if (guard && guard.type.name === 'paragraph' && guard.content.size === 0 && guard.marks.length === 0) {
      editor.view.dispatch(guardMeta(editor.state.tr
        .delete(editor.state.doc.content.size - guard.nodeSize, editor.state.doc.content.size)))
    }
    return result
  }

  // Pont entre le plugin ProseMirror de la lib et Tiptap : addProseMirrorPlugins() suffit pour
  // les décorations (suggestChanges() les fournit déjà via ses propres `props.decorations`,
  // composées automatiquement par ProseMirror - PAS besoin de toucher editorProps.decorations).
  // Pour l'interception des transactions, on utilise le hook d'extension `dispatchTransaction`
  // de Tiptap (ExtensionManager#dispatchTransaction, vérifié dans le code source de
  // @tiptap/core@3.31.3) qui COMPOSE avec le dispatch par défaut de Tiptap via `next(...)`,
  // plutôt que `editorProps.dispatchTransaction` qui le REMPLACERAIT entièrement (onUpdate et
  // toute la réactivité de Tiptap cesseraient de se déclencher - vérifié dans le code source :
  // `r = editorProps.dispatchTransaction || this.dispatchTransaction.bind(this)`).
  const SuggestChangesBridge = Extension.create({
    name: 'suggestChangesBridge',
    addProseMirrorPlugins() { return [suggestChanges()] },
    addCommands() {
      return {
        toggleSuggestMode: () => ({ state, dispatch }) => toggleSuggestChanges(state, dispatch),
        acceptAllSuggestions: () => ({ editor, dispatch, tr }) => runGuardedLibCommand(applySuggestions, editor, dispatch, tr),
        rejectAllSuggestions: () => ({ editor, dispatch, tr }) => runGuardedLibCommand(revertSuggestions, editor, dispatch, tr),
        acceptSuggestionsInSelection: () => ({ editor, dispatch, tr, state }) => {
          const { from, to } = state.selection
          return runGuardedLibCommand((s, d) => applySuggestion(undefined, from, to)(s, d), editor, dispatch, tr)
        },
        rejectSuggestionsInSelection: () => ({ editor, dispatch, tr, state }) => {
          const { from, to } = state.selection
          return runGuardedLibCommand((s, d) => revertSuggestion(undefined, from, to)(s, d), editor, dispatch, tr)
        },
        // Cible une suggestion par son id plutôt que par la sélection courante - plus robuste pour
        // un bloc entier (une ligne de tableau n'a pas de sélection de texte naturelle) et plus
        // proche de ce qu'un vrai bouton "accepter/refuser CE changement" ferait (l'id vient de
        // l'attribut data-id posé par InsertionMark/DeletionMark, pas de la sélection courante).
        acceptSuggestionById: (id) => ({ editor, dispatch, tr }) =>
          runGuardedLibCommand((s, d) => applySuggestion(id)(s, d), editor, dispatch, tr),
        rejectSuggestionById: (id) => ({ editor, dispatch, tr }) =>
          runGuardedLibCommand((s, d) => revertSuggestion(id)(s, d), editor, dispatch, tr),
      }
    },
    dispatchTransaction({ transaction, next }) {
      // `this` = l'objet de contexte fourni par ExtensionManager#dispatchTransaction (name,
      // options, storage, editor, type) - `editor` n'est PAS dans l'argument, seulement sur
      // `this` (constaté en testant ce prototype : `editor` déstructuré de l'argument valait
      // undefined).
      const editor = this.editor
      // BUG CORRIGÉ (2026-09-18) : garde alignée sur celle de withSuggestChanges() dans le code
      // source de la lib (dist/withSuggestChanges.js) - il manquait le test `'skip' in
      // tr.getMeta(suggestChangesKey)`. Sans lui, "tout accepter"/"tout refuser" (qui posent ce
      // meta pour dire « ceci EST déjà la transaction d'application, ne la re-transforme pas »)
      // étaient réinterceptées et re-transformées en NOUVELLES marques de suggestion au lieu
      // d'être appliquées telles quelles - constaté en testant : les marques ins/del survivaient à
      // "tout accepter" avec un nouvel id. Le test history$ seul ne suffit pas : accepter/refuser
      // n'est pas une opération d'historique.
      const skipMeta = transaction.getMeta(suggestChangesKey)
      const enabled = isSuggestChangesEnabled(editor.state)
        && !transaction.getMeta('history$')
        && !(skipMeta && 'skip' in skipMeta)
      if (!enabled) { next(transaction); return }
      // Filet de sécurité : depuis le correctif du 2026-09-19 (TrackedDocument/TrackedTable
      // ci-dessus), la suppression de bloc entier pour paragraphe/ligne de tableau ne devrait plus
      // lever d'exception. On garde le try/catch pour tout autre type de nœud de bloc pas encore
      // couvert (ex. un futur nœud custom de l'éditeur réel dont le parent n'autorise pas les 3
      // marques) : on REFUSE la transaction (jamais appliquée) plutôt que de planter la page ou de
      // laisser passer une suppression réelle non trackée en silence.
      try {
        next(transformToSuggestionTransaction(transaction, editor.state))
      } catch (e) {
        log('Transaction refusée (suppression de bloc entier non prise en charge par la lib) : ' + e.message)
      }
    },
  })

  let editor
  try {
    editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        StarterKit.configure({ document: false }), TrackedDocument,
        TrackedTable.configure({ resizable: false }), TableRow, TableHeader, TableCell,
        InsertionMark, DeletionMark, ModificationMark, SuggestChangesBridge,
      ],
      content: `
        <p>Ceci est un paragraphe de test. Activez le suivi puis tapez ou supprimez du texte ici.</p>
        <table><tbody>
          <tr><th>Article</th><th>Quantité</th></tr>
          <tr><td>Widget A</td><td>3</td></tr>
          <tr><td>Widget B</td><td>1</td></tr>
        </tbody></table>
        <p>Un second paragraphe après le tableau.</p>
      `,
      onUpdate: ({ editor }) => log('onUpdate déclenché (' + editor.getText().length + ' caractères) — la réactivité Tiptap fonctionne toujours'),
      onCreate: () => log('Éditeur créé sans exception.'),
    })
    window.__editor = editor // pour l'inspection console / Playwright
  } catch (e) {
    log('ÉCHEC DE CRÉATION DE L\'ÉDITEUR : ' + e.message)
    throw e
  }

  document.getElementById('btn-bold').onclick = () => editor.chain().focus().toggleBold().run()
  document.getElementById('btn-italic').onclick = () => editor.chain().focus().toggleItalic().run()
  document.getElementById('btn-toggle').onclick = () => {
    editor.chain().focus().toggleSuggestMode().run()
    const on = isSuggestChangesEnabled(editor.state)
    const btn = document.getElementById('btn-toggle')
    btn.textContent = 'Suivi : ' + (on ? 'activé' : 'désactivé')
    btn.classList.toggle('active', on)
    log('Suivi ' + (on ? 'activé' : 'désactivé'))
  }
  document.getElementById('btn-accept-all').onclick = () => { editor.chain().focus().acceptAllSuggestions().run(); log('Tout accepté') }
  document.getElementById('btn-reject-all').onclick = () => { editor.chain().focus().rejectAllSuggestions().run(); log('Tout refusé') }
  document.getElementById('btn-accept-sel').onclick = () => { editor.chain().focus().acceptSuggestionsInSelection().run(); log('Sélection acceptée') }
  document.getElementById('btn-reject-sel').onclick = () => { editor.chain().focus().rejectSuggestionsInSelection().run(); log('Sélection refusée') }
  document.getElementById('btn-undo').onclick = () => editor.chain().focus().undo().run()
  document.getElementById('btn-redo').onclick = () => editor.chain().focus().redo().run()
  document.getElementById('btn-del-row').onclick = () => {
    // Cas le plus risqué identifié dans le cadrage : supprimer un nœud complexe (une ligne de
    // tableau entière) pendant que le suivi est actif.
    const { state } = editor
    let from = -1, to = -1
    state.doc.descendants((node, pos) => {
      if (node.type.name === 'tableRow' && node.textContent.includes('Widget A')) { from = pos; to = pos + node.nodeSize }
    })
    if (from === -1) { log('Ligne "Widget A" introuvable (déjà supprimée ?)'); return }
    editor.chain().focus().deleteRange({ from, to }).run()
    log('Suppression de la ligne "Widget A" tentée (from=' + from + ', to=' + to + ')')
  }

  log('Script chargé, éditeur en cours d\'initialisation…')
</script>
</body>
</html>
