<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>Publipostage Grist (V2 — TipTap)</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../js/pdf-fonts.js?v=0.67"></script>
<script src="../js/pdf-fonts-extra.js?v=0.67"></script>
<!-- Import map : necessaire pour charger TipTap/ProseMirror sans bundler
     local (absent de l'environnement de dev) - fixe explicitement UNE SEULE
     instance de chaque paquet prosemirror-* partage entre @tiptap/core et
     les extensions, sans quoi ProseMirror leve "Adding different instances
     of a keyed plugin" (verifie en conditions reelles, cf. v2/smoke-test.html).
     Un script classique (pas type="module") peut resoudre ces specifiers nus
     via import() dynamique - cf. commentaire en tete de v2/js/editor.js. -->
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.11",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.4",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.12.0",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.42.3",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.5.0",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.3",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.7.1",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.8.5",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.4.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.2",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.5.1",
    "prosemirror-changeset": "https://esm.sh/*prosemirror-changeset@2.4.1",
    "@tiptap/core": "https://esm.sh/@tiptap/core@3.31.3",
    "@tiptap/pm": "https://esm.sh/@tiptap/pm@3.31.3",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@3.31.3",
    "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@3.31.3",
    "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@3.31.3",
    "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@3.31.3",
    "@tiptap/extension-font-family": "https://esm.sh/@tiptap/extension-font-family@3.31.3",
    "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@3.31.3",
    "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@3.31.3",
    "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@3.31.3",
    "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@3.31.3",
    "@tiptap/extension-task-list": "https://esm.sh/@tiptap/extension-task-list@3.31.3",
    "@tiptap/extension-task-item": "https://esm.sh/@tiptap/extension-task-item@3.31.3",
    "@tiptap/suggestion": "https://esm.sh/@tiptap/suggestion@3.31.3",
    "@floating-ui/dom": "https://esm.sh/@floating-ui/dom@1.6.12"
  }
}
</script>
<link rel="stylesheet" href="../css/roboto-fonts.css?v=0.67">
<link rel="stylesheet" href="../css/style.css?v=0.66">
<link rel="stylesheet" href="css/editor-v2.css?v=0.39">
<link rel="stylesheet" href="css/toolbar-v2.css?v=0.14">
</head>
<body>
<div id="app">
  <div id="toolbar-top">
    <div class="bar-row">
      <div class="title-cluster" id="v2-title-cluster">
        <select id="template-select" class="template-select" aria-label="Modèle"><option value="">-- Nouveau modèle --</option></select>
        <input id="template-name" type="text" class="title-cluster-input" placeholder="Nom du modèle" hidden>
        <button id="btn-rename-template" type="button" class="rename-btn" aria-label="Renommer le modèle" data-tip="Renommer"></button>
      </div>
      <div class="action-cluster">
        <button id="btn-new" aria-label="Nouveau modèle" data-tip="Nouveau modèle"></button>
        <button id="btn-save" aria-label="Enregistrer" data-tip="Enregistrer"></button>
        <button id="btn-save-as" aria-label="Enregistrer sous (copie)" data-tip="Enregistrer sous (copie)"></button>
        <button id="btn-delete" aria-label="Supprimer" data-tip="Supprimer"></button>
        <button id="btn-link-rules" aria-label="Tables liées (correspondance pour #Variable d'une autre table)" data-tip="Tables liées (correspondance #Variable)"></button>
      </div>
      <span class="bar-sep"></span>
      <div class="mode-toggle">
        <button id="btn-mode-edit" class="active" aria-label="Mode édition" data-tip="Mode édition"></button>
        <button id="btn-mode-read" aria-label="Mode lecture" data-tip="Mode lecture"></button>
      </div>
      <label class="a4-toggle" id="v2-a4-toggle" data-tip="Aperçu A4" aria-label="Aperçu A4 — limite la largeur de l'éditeur à celle du contenu d'une page A4, pour que le texte se répartisse comme dans le PDF.">
        <input type="checkbox" id="v2-toggle-a4-preview" checked><span class="a4-toggle-icon" aria-hidden="true"></span>
      </label>
      <span class="bar-sep"></span>
      <span class="v2-pdf-filename-cluster" id="v2-pdf-filename-cluster">
        <button type="button" id="btn-toggle-pdf-filename" aria-label="Nom de fichier PDF personnalisé" data-tip="Nom du fichier PDF"></button>
        <input id="pdf-filename-template" type="text" placeholder="Nom de fichier PDF (variables #… autorisées)" hidden>
      </span>
      <span class="v2-hover-group" id="v2-quality-group">
        <button type="button" id="v2-btn-quality" aria-label="Qualité d'export PDF" data-tip="Qualité PDF"></button>
        <select id="v2-pdf-quality" aria-label="Qualité d'export PDF" hidden>
          <option value="native" selected>Vectoriel (par défaut)</option>
          <option value="browser-print">Impr. navigateur</option>
          <option value="low">Basse qualité (compressé)</option>
          <option value="ultra">Ultra HD (impression)</option>
        </select>
        <span class="v2-hover-flyout v2-hover-flyout-v" id="v2-quality-flyout">
          <span class="v2-hover-row" data-quality="native">Vectoriel (par défaut)</span>
          <span class="v2-hover-row" data-quality="browser-print">Impr. navigateur</span>
          <span class="v2-hover-row" data-quality="low">Basse qualité (compressé)</span>
          <span class="v2-hover-row" data-quality="ultra">Ultra HD (impression)</span>
        </span>
      </span>
      <button id="btn-export-pdf" aria-label="Exporter en PDF" data-tip="Exporter en PDF"></button>
      <span id="status-msg"></span>
    </div>
    <div id="v2-toolbar">
      <select id="v2-header-select" data-tip="Titre" aria-label="Titre">
        <option value="p">Normal</option>
        <option value="1">Titre 1</option><option value="2">Titre 2</option><option value="3">Titre 3</option>
        <option value="4">Titre 4</option><option value="5">Titre 5</option><option value="6">Titre 6</option>
      </select>
      <button id="v2-btn-bold" data-tip="Gras" aria-label="Gras"></button>
      <button id="v2-btn-italic" data-tip="Italique" aria-label="Italique"></button>
      <button id="v2-btn-underline" data-tip="Souligné" aria-label="Souligné"></button>
      <button id="v2-btn-strike" data-tip="Barré" aria-label="Barré"></button>
      <span class="v2-sep"></span>
      <span class="v2-hover-group">
        <button id="v2-btn-align-main" data-tip="Alignement" aria-label="Alignement (survoler pour les options)"></button>
        <span class="v2-hover-flyout">
          <button id="v2-btn-align-left" data-tip="Aligner à gauche" aria-label="Aligner à gauche"></button>
          <button id="v2-btn-align-center" data-tip="Centrer" aria-label="Centrer"></button>
          <button id="v2-btn-align-right" data-tip="Aligner à droite" aria-label="Aligner à droite"></button>
          <button id="v2-btn-align-justify" data-tip="Justifier" aria-label="Justifier"></button>
        </span>
      </span>
      <span class="v2-sep"></span>
      <span class="v2-hover-group">
        <button id="v2-btn-bullet" data-tip="Liste" aria-label="Liste (survoler pour les styles)"></button>
        <span class="v2-hover-flyout v2-hover-flyout-v" id="v2-list-flyout">
          <span class="v2-hover-icon-row">
            <button id="v2-btn-bullet-disc" data-tip="Puce disque" aria-label="Puce disque"></button>
            <button id="v2-btn-bullet-circle" data-tip="Puce cercle" aria-label="Puce cercle"></button>
            <button id="v2-btn-bullet-square" data-tip="Puce carrée" aria-label="Puce carrée"></button>
          </span>
          <span class="v2-hover-hsep"></span>
          <span class="v2-hover-icon-row">
            <button id="v2-btn-ordered-numeric" data-tip="1. 2. 3." aria-label="Liste numérotée : 1. 2. 3."></button>
            <button id="v2-btn-ordered-alpha" data-tip="a. b. c." aria-label="Liste numérotée : a. b. c."></button>
            <button id="v2-btn-ordered-roman" data-tip="i. ii. iii." aria-label="Liste numérotée : chiffres romains"></button>
          </span>
          <span class="v2-hover-hsep"></span>
          <span class="v2-hover-icon-row">
            <button id="v2-btn-checklist-accent-strike" data-tip="Case à cocher (accent, texte barré)" aria-label="Liste à cases à cocher, style accent avec texte barré une fois cochée"></button>
            <button id="v2-btn-checklist-classic" data-tip="Case à cocher (classique)" aria-label="Liste à cases à cocher, style classique"></button>
            <button id="v2-btn-checklist-accent-plain" data-tip="Case à cocher (accent, texte normal)" aria-label="Liste à cases à cocher, style accent sans texte barré"></button>
          </span>
        </span>
      </span>
      <button id="v2-btn-outdent" class="v2-btn-discreet" data-tip="Diminuer le retrait" aria-label="Diminuer le retrait"></button>
      <button id="v2-btn-indent" class="v2-btn-discreet" data-tip="Augmenter le retrait" aria-label="Augmenter le retrait"></button>
      <span class="v2-sep"></span>
      <span class="v2-stepper" data-tip="Taille de police">
        <button type="button" id="v2-size-minus" aria-label="Diminuer la taille">–</button>
        <button type="button" class="v2-stepper-val" id="v2-size-chip-val">10.5pt</button>
        <button type="button" id="v2-size-plus" aria-label="Augmenter la taille">+</button>
      </span>
      <button type="button" class="v2-format-chip" id="v2-font-chip" data-tip="Police" aria-label="Police">
        <span class="v2-format-chip-val" id="v2-font-chip-val">Roboto</span>
        <span class="v2-format-chip-caret" id="v2-font-chip-caret"></span>
      </button>
      <span class="v2-sep"></span>
      <span class="v2-color-split">
        <button type="button" id="v2-btn-text-color" data-tip="Couleur de police" aria-label="Appliquer la dernière couleur de police">
          <span class="v2-color-split-icon" id="v2-text-color-icon">A</span>
        </button>
        <button type="button" id="v2-btn-text-color-caret" data-tip="Choisir une couleur" aria-label="Choisir une couleur de police">
          <span class="v2-color-split-caret" id="v2-color-text-caret"></span>
        </button>
      </span>
      <span class="v2-color-split">
        <button type="button" id="v2-btn-highlight" data-tip="Surligner" aria-label="Appliquer le dernier surlignage">
          <span class="v2-color-split-icon" id="v2-highlight-icon"></span>
        </button>
        <button type="button" id="v2-btn-highlight-caret" data-tip="Choisir un surlignage" aria-label="Choisir un surlignage">
          <span class="v2-color-split-caret" id="v2-color-highlight-caret"></span>
        </button>
      </span>
      <span class="v2-sep"></span>
      <button id="v2-btn-table" data-tip="Insérer un tableau" aria-label="Insérer un tableau"></button>
      <span class="v2-sep"></span>
      <button id="v2-btn-two-columns" data-tip="Insérer 2 colonnes" aria-label="Insérer 2 colonnes"></button>
      <button id="v2-btn-image" data-tip="Ajouter une image" aria-label="Insérer une image (URL)"></button>
      <button id="v2-btn-page-break" data-tip="Saut de page" aria-label="Insérer un saut de page (forcé à l'export PDF)"></button>
      <button id="v2-btn-toc" data-tip="Insérer un sommaire" aria-label="Insérer un sommaire (généré à partir des titres)"></button>
      <span class="v2-sep"></span>
      <span class="numbering-pill v2-hover-group">
        <button id="v2-btn-numbering-trigger" data-tip="Numérotation des titres" aria-label="Numérotation des titres — ne s'applique qu'aux titres du flux principal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6v12M4 12h6M10 6v12"/><text x="15.5" y="10.5" font-size="7.5" fill="currentColor" stroke="none" font-family="Manrope, sans-serif" font-weight="700">1.</text><text x="15.5" y="19" font-size="7.5" fill="currentColor" stroke="none" font-family="Manrope, sans-serif" font-weight="700">2.</text></svg>
        </button>
        <select id="v2-heading-numbering-select" aria-label="Numérotation des titres" hidden>
          <option value="none">Aucune</option>
          <option value="numeric">1), 2), 3)…</option>
          <option value="alpha">a), b), c)…</option>
          <option value="roman">I), II), III)…</option>
        </select>
        <span class="v2-hover-flyout v2-hover-flyout-v" id="v2-numbering-flyout">
          <span class="v2-hover-row" data-num="none">Aucune numérotation</span>
          <span class="v2-hover-row" data-num="numeric">1), 2), 3)…</span>
          <span class="v2-hover-row" data-num="alpha">a), b), c)…</span>
          <span class="v2-hover-row" data-num="roman">I), II), III)…</span>
        </span>
      </span>
      <span class="v2-sep"></span>
      <button id="v2-btn-undo" data-tip="Annuler" aria-label="Annuler"></button>
      <button id="v2-btn-redo" data-tip="Rétablir" aria-label="Rétablir"></button>
    </div>
  </div>
  <div id="editor-container"></div>
  <div id="reader-container" style="display:none;"></div>
  <div id="link-rules-modal" style="display:none;"><div class="modal-content link-rules-modal-content">
    <h3>Tables liées (correspondance pour #Variable)</h3>
    <div id="link-rules-list" class="link-rules-list"></div>
    <div class="modal-actions"><button id="link-rules-close">Fermer</button></div>
  </div></div>
  <div id="link-config-modal" style="display:none;"><div class="modal-content link-config-modal-content">
    <h3 id="link-config-title"></h3>
    <div id="link-config-match-fields" class="link-config-bridge" hidden>
      <div class="link-config-bridge-col"><label id="link-config-table-source-name"></label><select id="link-config-col-source"></select></div>
      <span class="link-config-eq">=</span>
      <div class="link-config-bridge-col"><label id="link-config-table-cible-name"></label><select id="link-config-col-cible"></select></div>
    </div>
    <div id="link-config-preview" class="link-config-preview" aria-live="polite"></div>
    <button type="button" id="link-config-toggle-singleton" class="link-config-toggle-link">Utiliser plutôt toujours la même ligne</button>
    <button type="button" id="link-config-toggle-match" class="link-config-toggle-link" hidden>Changer de correspondance</button>
    <div class="modal-actions"><button id="link-config-cancel">Annuler</button><button id="link-config-confirm" class="link-config-btn-primary">Valider</button></div>
  </div></div>
</div>
<script src="../js/grist-api.js?v=0.67"></script>
<script src="../js/templates.js?v=0.67"></script>
<script src="../js/reader-mode.js?v=0.69"></script>
<script src="js/heading-numbering.js?v=0.2"></script>
<script src="js/variable-format.js?v=0.4"></script>
<script src="js/variables.js?v=0.10"></script>
<script src="js/icons.js?v=0.14"></script>
<script src="js/editor.js?v=0.56"></script>
<script src="js/pdf-export.js?v=0.64"></script>
<script src="js/main.js?v=0.16"></script>
</body>
</html>
