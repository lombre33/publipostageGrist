<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>Publipostage Grist (V2 — TipTap)</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.min.js"></script>
<script src="../js/pdf-fonts.js?v=0.67"></script>
<script src="../js/pdf-fonts-extra.js?v=0.67"></script>
<!-- Import map : necessaire pour charger TipTap/ProseMirror sans bundler
     local (absent de l'environnement de dev) - fixe explicitement UNE SEULE
     instance de chaque paquet prosemirror-* partage entre @tiptap/core et
     les extensions, sans quoi ProseMirror leve "Adding different instances
     of a keyed plugin" (verifie en conditions reelles, cf. v2/smoke-test.html).
     Un script classique (pas type="module") peut resoudre ces specifiers nus
     via import() dynamique - cf. commentaire en tete de v2/js/editor.js. -->
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.11",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.4",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.12.0",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.42.3",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.5.0",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.3",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.7.1",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.8.5",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.4.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.2",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.5.1",
    "prosemirror-changeset": "https://esm.sh/*prosemirror-changeset@2.4.1",
    "@tiptap/core": "https://esm.sh/@tiptap/core@3.31.3",
    "@tiptap/pm": "https://esm.sh/@tiptap/pm@3.31.3",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@3.31.3",
    "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@3.31.3",
    "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@3.31.3",
    "@tiptap/extension-text-style": "https://esm.sh/@tiptap/extension-text-style@3.31.3",
    "@tiptap/extension-font-family": "https://esm.sh/@tiptap/extension-font-family@3.31.3",
    "@tiptap/extension-table": "https://esm.sh/@tiptap/extension-table@3.31.3",
    "@tiptap/extension-table-row": "https://esm.sh/@tiptap/extension-table-row@3.31.3",
    "@tiptap/extension-table-cell": "https://esm.sh/@tiptap/extension-table-cell@3.31.3",
    "@tiptap/extension-table-header": "https://esm.sh/@tiptap/extension-table-header@3.31.3",
    "@tiptap/suggestion": "https://esm.sh/@tiptap/suggestion@3.31.3",
    "@floating-ui/dom": "https://esm.sh/@floating-ui/dom@1.6.12"
  }
}
</script>
<link rel="stylesheet" href="../css/roboto-fonts.css?v=0.67">
<link rel="stylesheet" href="../css/style.css?v=0.66">
<link rel="stylesheet" href="css/editor-v2.css?v=0.22">
</head>
<body>
<div id="app">
  <div id="toolbar-top">
    <div class="bar-row">
      <select id="template-select" class="template-select" title="Modèle"><option value="">-- Nouveau modèle --</option></select>
      <button id="btn-new" title="Nouveau modèle"><span class="btn-text">Nouveau</span></button>
      <button id="btn-save" title="Enregistrer"><span class="btn-text">Enregistrer</span></button>
      <button id="btn-save-as" title="Enregistrer sous (copie)"><span class="btn-text">Enregistrer sous</span></button>
      <button id="btn-delete" title="Supprimer"><span class="btn-text">Supprimer</span></button>
      <input id="template-name" type="text" placeholder="Nom du modèle" style="margin-left:8px; min-width:160px;">
      <button id="btn-link-rules" title="Tables liées (correspondance pour #Variable d'une autre table)"><span class="btn-text">Tables liées</span></button>
      <span class="bar-sep"></span>
      <div class="mode-toggle">
        <button id="btn-mode-edit" class="active" title="Mode édition"><span class="btn-text">Édition</span></button>
        <button id="btn-mode-read" title="Mode lecture"><span class="btn-text">Lecture</span></button>
      </div>
      <label id="v2-a4-toggle" title="Limite la largeur de l'éditeur à celle du contenu d'une page A4, pour que le texte se répartisse comme dans le PDF.">
        <input type="checkbox" id="v2-toggle-a4-preview" checked> Aperçu A4
      </label>
      <span class="bar-sep"></span>
      <input id="pdf-filename-template" type="text" placeholder="Nom de fichier PDF (variables #… autorisées)" style="min-width:220px;">
      <button id="btn-export-pdf" title="Exporter en PDF (vectoriel)"><span class="btn-text">Exporter PDF</span></button>
      <span id="status-msg"></span>
    </div>
    <div id="v2-toolbar">
      <select id="v2-header-select" title="Titre">
        <option value="p">Normal</option>
        <option value="1">Titre 1</option><option value="2">Titre 2</option><option value="3">Titre 3</option>
        <option value="4">Titre 4</option><option value="5">Titre 5</option><option value="6">Titre 6</option>
      </select>
      <button id="v2-btn-bold" title="Gras"></button>
      <button id="v2-btn-italic" title="Italique"></button>
      <button id="v2-btn-underline" title="Souligné"></button>
      <button id="v2-btn-strike" title="Barré"></button>
      <span class="v2-sep"></span>
      <button id="v2-btn-align-left" title="Aligner à gauche"></button>
      <button id="v2-btn-align-center" title="Centrer"></button>
      <button id="v2-btn-align-right" title="Aligner à droite"></button>
      <button id="v2-btn-align-justify" title="Justifier"></button>
      <span class="v2-sep"></span>
      <button id="v2-btn-bullet" title="Liste à puces"></button>
      <button id="v2-btn-ordered" title="Liste numérotée"></button>
      <button id="v2-btn-blockquote" title="Citation"></button>
      <span class="v2-sep"></span>
      <select id="v2-size-select" title="Taille de police">
        <option value="">Taille</option>
        <option value="8pt">8pt</option><option value="9pt">9pt</option><option value="10pt">10pt</option>
        <option value="10.5pt" selected>10.5pt</option><option value="11pt">11pt</option><option value="12pt">12pt</option>
        <option value="14pt">14pt</option><option value="16pt">16pt</option><option value="18pt">18pt</option>
        <option value="20pt">20pt</option><option value="24pt">24pt</option><option value="28pt">28pt</option>
        <option value="32pt">32pt</option><option value="36pt">36pt</option><option value="48pt">48pt</option><option value="72pt">72pt</option>
      </select>
      <select id="v2-font-select" title="Police">
        <option value="">Police</option>
        <option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option>
        <option value="Georgia">Georgia</option><option value="Courier New">Courier New</option><option value="Calibri">Calibri</option>
      </select>
      <span class="v2-sep"></span>
      <button id="v2-btn-text-color" class="v2-color-split" title="Couleur de police">
        <span class="v2-color-split-icon">A</span>
        <span class="v2-color-split-bar" id="v2-color-text-bar"></span>
        <span class="v2-color-split-caret" id="v2-color-text-caret"></span>
      </button>
      <button id="v2-btn-highlight" class="v2-color-split" title="Surligner">
        <span class="v2-color-split-icon" id="v2-highlight-icon"></span>
        <span class="v2-color-split-bar" id="v2-color-highlight-bar"></span>
        <span class="v2-color-split-caret" id="v2-color-highlight-caret"></span>
      </button>
      <span class="v2-sep"></span>
      <button id="v2-btn-table" title="Insérer un tableau"></button>
      <span class="v2-sep"></span>
      <button id="v2-btn-two-columns" title="Insérer 2 colonnes"></button>
      <button id="v2-btn-image" title="Insérer une image (URL)"></button>
      <button id="v2-btn-page-break" title="Insérer un saut de page (forcé à l'export PDF)"></button>
      <button id="v2-btn-toc" title="Insérer un sommaire (généré à partir des titres)"></button>
      <span class="v2-sep"></span>
      <select id="v2-heading-numbering-select" title="Numérotation des titres — ne s'applique qu'aux titres du flux principal (pas ceux d'un tableau ou d'une zone 2 colonnes)">
        <option value="none">Numérotation : aucune</option>
        <option value="numeric">1), 2), 3)…</option>
        <option value="alpha">a), b), c)…</option>
        <option value="roman">I), II), III)…</option>
      </select>
      <span class="v2-sep"></span>
      <button id="v2-btn-undo" title="Annuler"></button>
      <button id="v2-btn-redo" title="Rétablir"></button>
    </div>
  </div>
  <div id="editor-container"></div>
  <div id="reader-container" style="display:none;"></div>
  <div id="link-rules-modal" style="display:none;"><div class="modal-content link-rules-modal-content">
    <h3>Tables liées (correspondance pour #Variable)</h3>
    <div id="link-rules-list" class="link-rules-list"></div>
    <div class="modal-actions"><button id="link-rules-close">Fermer</button></div>
  </div></div>
  <div id="link-config-modal" style="display:none;"><div class="modal-content link-config-modal-content">
    <h3 id="link-config-title"></h3>
    <div class="link-config-mode">
      <label><input type="radio" name="link-config-mode" value="match"> Retrouver la ligne qui correspond à la ligne courante<span class="link-config-hint">Cas normal : la table cible contient plusieurs lignes (une par élément), il faut retrouver la bonne à chaque fois.</span></label>
      <label><input type="radio" name="link-config-mode" value="singleton"> Toujours utiliser la même ligne, quelle que soit la ligne courante<span class="link-config-hint">Cas particulier : la table cible n'a qu'une seule ligne utile pour tout le document (ex. une table de paramètres).</span></label>
    </div>
    <div id="link-config-match-fields" class="link-config-match-fields" hidden>
      <div class="toolbar-panel-field"><label>Colonne dans <span id="link-config-table-cible-name"></span></label><select id="link-config-col-cible"></select></div>
      <div class="toolbar-panel-field"><label>Colonne correspondante dans <span id="link-config-table-source-name"></span></label><select id="link-config-col-source"></select></div>
      <p class="link-config-explain">La ligne retenue sera celle où ces deux colonnes ont la même valeur.</p>
    </div>
    <div id="link-config-preview" class="link-config-preview" aria-live="polite"></div>
    <div class="modal-actions"><button id="link-config-confirm">Valider</button><button id="link-config-cancel">Annuler</button></div>
  </div></div>
</div>
<script src="../js/grist-api.js?v=0.66"></script>
<script src="../js/templates.js?v=0.66"></script>
<script src="../js/reader-mode.js?v=0.67"></script>
<script src="js/heading-numbering.js?v=0.1"></script>
<script src="js/variables.js?v=0.3"></script>
<script src="js/icons.js?v=0.4"></script>
<script src="js/editor.js?v=0.34"></script>
<script src="js/pdf-export.js?v=0.56"></script>
<script src="js/main.js?v=0.7"></script>
</body>
</html>
