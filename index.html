<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>Publipostage Grist</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script><link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"><script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><link rel="stylesheet" href="css/style.css">
</head><body><div id="app"><div id="toolbar-top"><div class="template-bar"><label>Modèle :</label><select id="template-select"><option value="">-- Nouveau modèle --</option></select><input id="template-name" type="text" placeholder="Nom du modèle"><button id="btn-new">Nouveau</button><button id="btn-save">Enregistrer</button><button id="btn-save-as">Enregistrer sous</button><button id="btn-delete">Supprimer</button></div><div class="filename-bar"><label>Nom de fichier PDF (variables autorisées) :</label><input id="pdf-filename-template" type="text" placeholder="ex: Courrier_#Clients_Nom"></div><div class="mode-bar"><button id="btn-mode-edit" class="active">Mode édition</button><button id="btn-mode-read">Mode lecture</button><button id="btn-export-pdf">Exporter en PDF</button><span id="status-msg"></span></div></div><div id="editor-toolbar"></div><div id="editor-container"></div><div id="reader-warning-banner" style="display:none;" role="alert" aria-live="polite"></div><div id="reader-container" style="display:none;"></div><div id="autocomplete-box" style="display:none;"></div><div id="ref-choice-modal" style="display:none;"><div class="modal-content"><p id="ref-choice-text"></p><select id="ref-choice-select"></select><button id="ref-choice-confirm">Valider</button><button id="ref-choice-cancel">Annuler</button></div></div></div><script src="js/grist-api.js"></script><script src="js/variables.js"></script><script src="js/editor.js"></script><script src="js/templates.js"></script><script src="js/reader-mode.js"></script><script src="js/pdf-export.js"></script><script src="js/main.js"></script></body></html>
